<html>
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên</title>

    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
        }

        .container {
            width: 580px;
            border: 1px solid #6699cc;
            padding: 6px;
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        hr {
            border: 0;
            border-top: 1px solid #999;
        }

        .dong {
            margin-bottom: 2px;
        }

        input[type="text"],
        input[type="email"] {
            width: 150px;
        }

        .sothich {
            margin-top: 12px;
        }

        .mau {
            margin-top: 4px;
        }

        .nut {
            margin-top: 12px;
            margin-bottom: 8px;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            text-align: left;
            padding: 2px;
        }

        th {
            background-color: blue;
            color: white;
        }
    </style>

    <script>
        
        function loadDay() {
            var sel_day = document.getElementById("sel_day");
            var i = 1;

            while (i <= 31) {
                var opt = document.createElement("option");
                opt.value = i;
                opt.innerHTML = String(i).padStart(2, "0");
                sel_day.appendChild(opt);
                i = i + 1;
            }
        }

      
        function loadMonth() {
            var sel_month = document.getElementById("sel_month");
            var i = 1;

            while (i <= 12) {
                var opt = document.createElement("option");
                opt.value = i;
                opt.innerHTML = i;
                sel_month.appendChild(opt);
                i = i + 1;
            }
        }

        function loadYear() {
            var sel_year = document.getElementById("sel_year");

            for (var i = 1970; i <= 2026; i++) {
                var opt = document.createElement("option");
                opt.value = i;
                opt.innerHTML = i;
                sel_year.appendChild(opt);
            }
        }


        function DangKy() {
            var ten = document.getElementById("Ten").value.trim();
            var email = document.getElementById("Email").value.trim();

            if (ten == "") {
                alert("Tên không được bỏ trống!");
                document.getElementById("Ten").focus();
                return;
            }

            var mauEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!mauEmail.test(email)) {
                alert("Email không hợp lệ!");
                document.getElementById("Email").focus();
                return;
            }

            var gioitinh =
                document.querySelector('input[name="Gioitinh"]:checked').value;


            var day = document.getElementById("sel_day").value;
            var month = document.getElementById("sel_month").value;
            var year = document.getElementById("sel_year").value;

            var ngaysinh =
                String(day).padStart(2, "0") + "/" +
                String(month).padStart(2, "0") + "/" + year;

            var ds = document.querySelectorAll(
                'input[name="Sothich"]:checked'
            );

            var sothich = [];

            for (var i = 0; i < ds.length; i++) {
                sothich.push(ds[i].value);
            }


            var mausac =
                document.querySelector('input[name="Mausac"]:checked').value;

            var tbody = document.getElementById("DanhSach");
            var tr = document.createElement("tr");

            var dulieu = [
                ten,
                email,
                gioitinh,
                ngaysinh,
                sothich.join(", "),
                mausac
            ];

            for (var i = 0; i < dulieu.length; i++) {
                var td = document.createElement("td");
                td.textContent = dulieu[i];
                tr.appendChild(td);
            }


            tr.onmouseover = function() {
                this.style.backgroundColor = "yellow";
            };

            tr.onmouseout = function() {
                this.style.backgroundColor = "white";
            };

            tbody.appendChild(tr);
        }

        function Tiep() {
            document.getElementById("registerForm").reset();

            document.getElementById("sel_day").value = "1";
            document.getElementById("sel_month").value = "1";
            document.getElementById("sel_year").value = "1970";

            document.getElementById("Ten").focus();
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>Đăng ký thành viên</h1>
        <hr>

        <form id="registerForm">
            <div class="dong">
                Tên(*)
                <input type="text" id="Ten" name="Ten">
            </div>

            <div class="dong">
                Ngày sinh(*)
                Ngày:
                <select id="sel_day"></select>

                Tháng:
                <select id="sel_month"></select>

                Năm:
                <select id="sel_year"></select>
            </div>

            <div class="dong">
                Giới tính(*)
                <input type="radio" name="Gioitinh" value="Nam" checked>Nam
                <input type="radio" name="Gioitinh" value="Nữ">Nữ
            </div>

            <div class="dong">
                Email(*)
                <input type="email" id="Email" name="Email">
            </div>

            <div class="sothich">
                Sở thích của bạn:<br>

                <input type="checkbox" name="Sothich" value="Mua sắm" checked>
                Mua sắm<br>

                <input type="checkbox" name="Sothich" value="Du lịch" checked>
                Du lịch<br>

                <input type="checkbox" name="Sothich" value="Tán gẫu" checked>
                Tán gẫu<br>

                <input type="checkbox" name="Sothich" value="Đọc sách" checked>
                Đọc sách<br>

                <input type="checkbox" name="Sothich" value="Nghe nhạc" checked>
                Nghe nhạc
            </div>

            <div class="mau">
                Màu yêu thích của bạn:<br>

                <input type="radio" name="Mausac"
                       value="Màu xanh da trời" checked>
                <span style="background-color: blue; color: white;">
                    Màu xanh da trời
                </span><br>

                <input type="radio" name="Mausac" value="Màu đỏ">
                <span style="background-color: red;">Màu đỏ</span><br>

                <input type="radio" name="Mausac" value="Màu vàng">
                <span style="background-color: yellow;">Màu vàng</span><br>

                <input type="radio" name="Mausac" value="Màu xanh lá cây">
                <span style="background-color: lime;">
                    Màu xanh xanh lá cây
                </span><br>

                <input type="radio" name="Mausac" value="Màu xanh tím">
                <span style="background-color: violet;">Màu xanh tím</span>
            </div>

            <div class="nut">
                <input type="button" value="Đăng ký" onclick="DangKy()">
                <input type="button" value="Tiếp" onclick="Tiep()">
            </div>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Giới tính</th>
                    <th>Năm sinh</th>
                    <th>Sở thích</th>
                    <th>Màu yêu thích</th>
                </tr>
            </thead>

            <tbody id="DanhSach"></tbody>
        </table>
    </div>

    <script>
        loadDay();
        loadMonth();
        loadYear();
    </script>
</body>
</html>
