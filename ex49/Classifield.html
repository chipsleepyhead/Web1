<!DOCTYPE html>
<html>
<head>
    <title>Online Classifieds Search Form</title>
    <style type="text/css">
        body {
            background-color: white;
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
        }
        .form-container {
            width: 500px;
            margin: 20px;
            padding: 20px 10px;
            background-color: #ccffff;
            border: 2px solid #0033cc;
        }
        h1 {
            color: red;
            margin-top: 0;
        }
        .title {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        
        .group-container {
            display: flex;
            gap: 40px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
      
        label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .date-input{
            width: 140px;
            padding: 2px 4px;
            border: 1px solid #7f9db9;
        }
    </style>
    <script>
        function Search(){
            alert("Đang tìm dữ liệu");
        }
        function Help(){
            window.open("https://www.google.com");
        }

    </script>
</head>
<body>
    <div class="form-container">
        <h1>Online Classifieds Search Form</h1>
        <hr>
        <form>
            <div class="title">
                1) Search for a Classified in the following sections
            </div>
            <div class="group-container">
                <div class="column">
                    <label>
                        <input type="radio" name="section" value="Employment">
                        Employment
                    </label>
                    <label>
                        <input type="radio" name="section" value="For Sale">
                        For Sale
                    </label>
                    <label>
                        <input type="radio" name="section" value="Housing">
                        Housing
                    </label>
                </div>
                <div class="column">
                    <label>
                        <input type="radio" name="section" value="Personal">
                        Personal
                    </label>
                    <label>
                        <input type="radio" name="section" value="Miscellaneous">
                        Miscellaneous
                    </label>
                    <label>
                        <input type="radio" name="section" value="All of above">
                        All of above
                    </label>
                </div>
            </div>

            <div class="title">
                2) Search the following publications:
            </div>
            <div class="group-container">
                <div class="column">
                    <label>
                        <input type="checkbox" name="publication" value="Midwest times">
                        Midwest times
                    </label>
                    <label>
                        <input type="checkbox" name="publication" value="Great Lakes Classifieds">
                        Great Lakes Classifieds
                    </label>
                </div>
                <div class="column">
                    <label>
                        <input type="checkbox" name="publication" value="Modern News">
                        Modern News
                    </label>
                    <label>
                        <input type="checkbox" name="publication" value="Middleton Daily">
                        Middleton Daily
                    </label>
                </div>
                <div class="column">
                    <label>
                        <input type="checkbox" name="publication" value="Employment Today">
                        Employment Today
                    </label>
                    <label>
                        <input type="checkbox" name="publication" value="Cashtown Daily News">
                        Cashtown Daily News
                    </label>
                </div>
            </div>
            <div class="title">
                Form to
                <input type="text" value="mm/dd/yy" class="date-input"> 
                to <input type="text" value="mm/dd/yy" class="date-input">
            </div>
            <div class="title">
                4) Enter a few keywords to describe the Classified.
            </div>
            <div>
                <input type="text" name="keywords">
            </div>
            <div class="title">
                5) Click one of the options below:
            </div>
            <div>
                <button type="button">
                    <img src="images/Search.gif" onclick="Search()">
                </button>
                <button type="button" onclick="Help()">
                    <img src="images/Help.gif">
                </button>
                <button type="reset">
                    <img src="images/Cancel.gif">
                </button>

            </div>
        </form>
    </div>
</body>
</html>
